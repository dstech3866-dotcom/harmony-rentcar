function hIsPromo(car){const keys=window.__hPromoSortKeys;if(!keys||!keys.size)return false;const name=[car.model,car.detail].join(' ');const year=[car.year,car.model,car.detail].join(' ');return /아반떼/i.test(name)&&/(2026|26년|26MY)/i.test(year)&&keys.has(String(car.assetCode||car.plate||'').trim())}
function hSortCars(items){return [...items].sort((a,b)=>Number(hIsPromo(b))-Number(hIsPromo(a))||hMinRent(a)-hMinRent(b))}
function table(items,term){items=hSortCars(items);let rows='';for(const c of items){const terms=(c.terms||[]).filter(t=>!term||String(t.months)===term).sort((a,b)=>b.months-a.months);if(!terms.length)continue;terms.forEach((t,i)=>{rows+=`<tr>${i===0?`<td rowspan="${terms.length}" class="plate">${esc(String(c.plate||'').replace(/번호판\s*등록\s*예정|번호판\s*미등록|차량번호\s*미등록|차량번호 미등록|미등록/g,'등록예정'))}</td><td class="harmony-year" rowspan="${terms.length}">${esc(c.year)}</td><td class="harmony-fuel" rowspan="${terms.length}">${esc(c.fuel)}</td><td rowspan="${terms.length}" class="model">${esc(c.detail||c.model)}</td><td rowspan="${terms.length}">${esc(c.color)}</td><td rowspan="${terms.length}">${esc(c.interior)}</td><td rowspan="${terms.length}">${esc(c.distance)}</td><td rowspan="${terms.length}" class="money">${cleanMoney(harmonyPrice(c))}</td>`:''}<td class="money">${cleanMoney(t.deposit)}</td><td><span class="months">${esc(t.months)}개월</span></td><td class="rent">${cleanMoney(t.rent)}</td><td class="buyout">${cleanMoney(t.buyout)}</td>${i===0?`<td rowspan="${terms.length}" class="option">${esc(c.options||'무옵션')}</td>`:''}</tr>`})}return `<div class="table-scroll" role="region" aria-label="차량 가격표 좌우 스크롤" tabindex="0"><table class="price-table"><thead><tr><th>차량번호</th><th>연식</th><th>연료</th><th>차종 / 세부모델</th><th>외장 색상</th><th>내장 색상</th><th>주행거리</th><th>차량가격</th><th>보증금</th><th>계약기간</th><th>월 렌트료</th><th>만기 인수가</th><th>옵션내용</th></tr></thead><tbody>${rows}</tbody></table></div>`}let selectedBrand='',selectedType='';
const carType=c=>{const v=[c.model,c.detail].join(' ').toLowerCase();if(/ev[3469]|아이오닉|전기|electric|e-tron|eqe|eqs|테슬라|model [3syx]|폴스타|타이칸|니로 ev|코나 ev/.test(v))return '전기차';if(/카니발|스타리아|스타렉스|쏠라티|투리스모|로디우스|알파드|시에나|v-class/.test(v))return 'RV·승합';if(/suv|gv[678]0|스포티지|쏘렌토|싼타페|투싼|셀토스|코나|베뉴|팰리세이드|모하비|니로|토레스|티볼리|렉스턴|액티언|qm[356]|xm3|아르카나|캡처|트레일블레이저|트랙스|이쿼녹스|콜로라도|익스플로러|x[1-7]|gl[abcse]|q[23578]|xc[469]0|카이엔|마칸|레인지로버|디스커버리|디펜더|랭글러|컴패스|체로키/.test(v))return 'SUV';return '승용'};
function filterButtons(){const brands=[...new Set(cars.map(c=>c.brand||'기타'))].sort(kr);const types=['승용','전기차','RV·승합','SUV'].filter(t=>cars.some(c=>carType(c)===t));if(selectedBrand&&!brands.includes(selectedBrand))selectedBrand='';if(selectedType&&!types.includes(selectedType))selectedType='';const make=(id,values,current,callback)=>{document.getElementById(id).innerHTML=['',...values].map(v=>`<button type="button" class="${v===current?'active':''}" data-value="${esc(v)}" aria-pressed="${v===current}">${esc(v||'전체')}</button>`).join('');document.getElementById(id).querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>callback(b.dataset.value)))};make('brandFilters',brands,selectedBrand,v=>{selectedBrand=v;filterButtons();render()});make('typeFilters',types,selectedType,v=>{selectedType=v;filterButtons();render()})}
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),term=document.getElementById('term').value;const selected=cars.filter(c=>([c.detail,c.model,c.plate,c.brand,c.fuel].join(' ').toLowerCase().includes(q))&&(!term||(c.terms||[]).some(t=>String(t.months)===term))&&(!selectedBrand||(c.brand||'기타')===selectedBrand)&&(!selectedType||carType(c)===selectedType));const plates=new Set(selected.map(c=>c.plate));document.getElementById('summary').textContent=`중고차 6·12개월 렌트 ${plates.size}대 · 계약조건 ${selected.reduce((n,c)=>n+(c.terms||[]).filter(t=>!term||String(t.months)===term).length,0)}건`;if(!selected.length){list.innerHTML='<div class="panel empty">조건에 맞는 차량이 없습니다.</div>';return}const groups=new Map();for(const c of selected){const brand=c.brand||'기타',model=c.model||'기타';if(!groups.has(brand))groups.set(brand,new Map());const models=groups.get(brand);if(!models.has(model))models.set(model,[]);models.get(model).push(c)}list.innerHTML=[...groups].sort((a,b)=>kr(a[0],b[0])).map(([brand,models])=>`<section><div class="brand-title">${esc(brand)}</div>${[...models].sort((a,b)=>kr(a[0],b[0])).map(([model,items])=>{const count=new Set(items.map(c=>c.plate)).size;const fuelGroups=new Map();for(const c of items){const fuel=c.fuel||'미등록';if(!fuelGroups.has(fuel))fuelGroups.set(fuel,[]);fuelGroups.get(fuel).push(c)}return `<div class="model-title">${esc(model)} · ${count}대</div>${[...fuelGroups].sort((a,b)=>kr(a[0],b[0])).map(([fuel,arr])=>`<div class="fuel-title">연료 · ${esc(fuel)} · ${new Set(arr.map(c=>c.plate)).size}대</div>${table(arr,term)}`).join('')}`}).join('')}</section>`).join('')}
// 6·12개월 상품은 게시된 JSON만 표시합니다. 예전 inventory.xls로 되돌아가지 않습니다.
(async()=>{
  try{
    const r=await fetch(ROOT+'inventory/used612.json?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw Error('게시된 차량 목록을 읽지 못했습니다 (HTTP '+r.status+')');
    const d=await r.json();
    if(!d||!Array.isArray(d.cars))throw Error('게시 파일 형식이 올바르지 않습니다');
    cars=d.cars;
    filterButtons();render();
  }catch(e){
    cars=[];
    filterButtons();render();
    document.getElementById('summary').textContent='6·12개월 게시 목록을 불러오지 못했습니다: '+e.message+' · 관리자에서 엑셀을 다시 게시해 주세요.';
  }
})();
document.getElementById('search').addEventListener('input',render);document.getElementById('term').addEventListener('change',render);
</script></body></html>
