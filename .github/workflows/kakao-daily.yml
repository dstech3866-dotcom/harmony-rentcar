name: Update Kakao preview date (KST)
on:
  schedule:
    - cron: '15 15 * * *' # 00:15 in Korea (UTC+9)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/make_kakao_daily.py'
      - 'harmony_kakao_selected_design.jpg'
      - 'scripts/make_kakao_vertical_daily.py'
      - 'harmony_kakao_promo_1200x1600.jpg'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install Pillow
      - name: Generate, verify and safely retry once if needed
        shell: bash
        run: |
          set -euo pipefail
          generate_and_validate() {
            python scripts/make_kakao_daily.py
            python scripts/make_kakao_vertical_daily.py
            python scripts/validate_kakao_daily.py
          }
          if ! generate_and_validate; then
            echo "::warning::Daily image generation/validation failed. Retrying once with original source artwork."
            generate_and_validate
          fi
      - name: Commit new daily image (triggers Netlify deploy)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kakao-daily/ kakao-vertical-daily/
          if ! git diff --cached --quiet; then
            git commit -m "Update Kakao date preview (KST)"
            git push
          fi
