name: Update Kakao preview date (KST)
on:
  schedule:
    - cron: '*/5 * * * *' # Check admin-selected Kakao design every 5 minutes (UTC); also updates KST date
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/make_kakao_daily.py'
      - 'harmony_kakao_selected_design.jpg'
      - 'scripts/make_kakao_vertical_daily.py'
      - 'harmony_kakao_promo_1200x1600.jpg'
concurrency:
  group: kakao-daily-image-generation
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install Pillow
      - name: Generate, verify and safely retry once if needed
        shell: bash
        run: |
          set -euo pipefail
          generate_and_validate() {
            python scripts/make_kakao_daily.py
            python scripts/make_kakao_vertical_daily.py
            python scripts/validate_kakao_daily.py
          }
          if ! generate_and_validate; then
            echo "::warning::Daily image generation/validation failed. Retrying once with original source artwork."
            generate_and_validate
          fi
      - name: Publish generated images directly to Supabase Storage (no Git commit)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Set SUPABASE_SERVICE_ROLE_KEY as a GitHub Actions repository secret before enabling this workflow."
            exit 1
          fi
          python scripts/publish_kakao_to_supabase.py
