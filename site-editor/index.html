<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배너 및 계약 안내 관리 | 하모니렌트카</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f5fa;color:#153657;font:16px/1.55 system-ui,'Malgun Gothic',sans-serif}main{max-width:1050px;margin:25px auto;padding:0 16px}h1{font-size:27px}h2{font-size:21px;margin:0 0 16px}section{background:white;border:1px solid #d3e2ef;border-radius:15px;padding:24px;margin:18px 0}label{font-weight:700;display:block;margin:12px 0 4px}input,textarea{width:100%;border:1px solid #b9cfe0;border-radius:7px;padding:10px;font:inherit;color:#183c5d}textarea{min-height:75px;resize:vertical}input[type=color]{height:45px;padding:4px}input[type=checkbox]{width:auto;transform:scale(1.2);margin-right:9px}button,.btn{border:0;background:#1a5786;color:white;padding:12px 18px;border-radius:9px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#dce8f3;color:#163d61}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.preview{padding:18px;text-align:center;border-radius:12px;margin:14px 0;font-weight:900}.small{font-size:13px;color:#627b91}.danger{color:#a22}.status{font-weight:800}#editor[hidden],#login[hidden]{display:none} .actions{position:sticky;bottom:0;background:#eaf3fb;padding:15px;border-radius:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center} </style></head><body><main>
<a class="btn secondary" href="/admin/">← 관리자 센터</a><h1>메인 배너 · 보증금 분납 계약 안내 관리</h1><p>문구·색상·크기를 변경한 뒤 게시 저장하면 고객 화면에 반영됩니다. 기존 재고와 차량별 분납 설정은 변경하지 않습니다.</p>
<section id="login"><h2>관리자 로그인</h2><label>이메일<input id="email" type="email" autocomplete="username" value="dstech3866@gmail.com"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password"></label><p><button id="signIn">로그인</button></p><p id="loginStatus" class="status"></p></section>
<div id="editor" hidden>
<section><h2>① 만 23세 이상 ~ 만 26세 미만 배너</h2><label><input type="checkbox" id="age23_visible" checked>고객 홈페이지에 표시</label><label>배너 문구<input id="age23_title"></label><div class="grid"><label>배경색<input id="age23_background" type="color"></label><label>글자색<input id="age23_color" type="color"></label><label>테두리색<input id="age23_borderColor" type="color"></label><label>글자 크기(px)<input id="age23_fontSize" type="number" min="12" max="34"></label><label>최소 높이(px)<input id="age23_height" type="number" min="32" max="180"></label><label>모서리 둥글기(px)<input id="age23_radius" type="number" min="0" max="35"></label></div><div class="preview" id="age23_preview"></div></section>
<section><h2>② 보증금 분납 배너</h2><label><input type="checkbox" id="deposit_visible" checked>고객 홈페이지에 표시</label><label>배너 문구<input id="deposit_title"></label><div class="grid"><label>배경색<input id="deposit_background" type="color"></label><label>글자색<input id="deposit_color" type="color"></label><label>테두리색<input id="deposit_borderColor" type="color"></label><label>글자 크기(px)<input id="deposit_fontSize" type="number" min="12" max="34"></label><label>최소 높이(px)<input id="deposit_height" type="number" min="32" max="180"></label><label>모서리 둥글기(px)<input id="deposit_radius" type="number" min="0" max="35"></label></div><div class="preview" id="deposit_preview"></div></section>
<section><h2>③ 보증금 분납 계약 필수 안내</h2><label><input type="checkbox" id="notice_visible" checked>고객 안내문 표시</label><p class="small">아래 문구는 고객에게 그대로 표시됩니다. 계약·위약금 관련 문구 변경 전 계약 조건과 일치하는지 확인해 주세요.</p><div id="noticeFields"></div></section>
<div class="actions"><button id="save">게시 저장</button><button id="reload" class="btn secondary">저장 내용 다시 불러오기</button><a class="btn secondary" href="/" target="_blank" rel="noopener">메인 미리보기</a><a class="btn secondary" href="/deposit-installment/" target="_blank" rel="noopener">분납 안내 미리보기</a><button id="signOut" class="btn secondary">로그아웃</button><span id="status" class="status" role="status"></span></div></div></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const client=createClient('https://gaygechqnvehajmsnvfb.supabase.co','sb_publishable_OFGuCgOffh-ofXnDu80eAA_9Z1wQclO');
const path='inventory/site-content.json',bucket='gallery',$=id=>document.getElementById(id);
const defaults={age23:{visible:true,title:'만 23세 이상 ~ 만 26세 미만 차량 보기 →',background:'#d7f0ed',color:'#075c5c',borderColor:'#d7f0ed',fontSize:17,height:48,radius:12},deposit:{visible:true,title:'💰 보증금 분납 가능차량 보기  ·  2회 분납 →',background:'#ffbd36',color:'#522500',borderColor:'#e18b00',fontSize:23,height:74,radius:13},notice:{visible:true,intro:'보증금 분납은 최대 2회까지 가능합니다.',due:'최초 차량 인도일을 기준으로 다음 달 같은 날짜가 2회차 납부일입니다.',example:'예) 최초 차량 인도일 11월 10일 → 2회차 납부일 12월 10일',payment:'2회차 납부일에는 2회차 보증금 및 렌트료 모두 입금되어야 합니다.',fee:'※ 보증금 분납 시 수수료는 50%씩 두 번 나누어 지급됩니다.',alert:'⚠ 미납 시 다음 날 계약 해지',percent:'중도해지위약금 30%',penalty:'남은 기간(47개월)의 렌트료를 기준으로 청구합니다. 기간에 관계없이 남은 렌트료의 30%가 적용됩니다.',final:'반드시 확인하시고 계약을 진행해 주세요.'}};
const noticeLabels={intro:'분납 횟수',due:'2회차 납부일 안내',example:'납부일 예시',payment:'2회차 보증금·렌트료',fee:'수수료 안내',alert:'미납 시 경고',percent:'중도해지위약금',penalty:'위약금 상세 설명',final:'마지막 안내'};
for(const [key,label]of Object.entries(noticeLabels)){const wrap=document.createElement('label');wrap.textContent=label;const field=document.createElement('textarea');field.id='notice_'+key;wrap.append(field);$('noticeFields').append(wrap)}
function fill(data){for(const type of ['age23','deposit'])for(const key of ['visible','title','background','color','borderColor','fontSize','height','radius']){const e=$(type+'_'+key),v=data[type]?.[key]??defaults[type][key];if(key==='visible')e.checked=v!==false;else e.value=v}for(const k of Object.keys(noticeLabels))$('notice_'+k).value=data.notice?.[k]??defaults.notice[k];$('notice_visible').checked=data.notice?.visible!==false;preview()}
function readForm(){const out={};for(const type of ['age23','deposit']){out[type]={};for(const key of ['visible','title','background','color','borderColor','fontSize','height','radius']){const e=$(type+'_'+key);out[type][key]=key==='visible'?e.checked:['fontSize','height','radius'].includes(key)?Number(e.value):e.value}}out.notice={visible:$('notice_visible').checked};for(const k of Object.keys(noticeLabels))out.notice[k]=$('notice_'+k).value;return out}
function preview(){const data=readForm();for(const type of ['age23','deposit']){const p=$(type+'_preview'),v=data[type];p.textContent=v.visible?v.title:'[숨김] '+v.title;p.style.background=v.background;p.style.color=v.color;p.style.border='2px solid '+v.borderColor;p.style.fontSize=v.fontSize+'px';p.style.minHeight=v.height+'px';p.style.borderRadius=v.radius+'px'}}
$('editor').addEventListener('input',preview);$('editor').addEventListener('change',preview);
async function load(){try{const r=await fetch('https://gaygechqnvehajmsnvfb.supabase.co/storage/v1/object/public/gallery/'+path+'?v='+Date.now(),{cache:'no-store'});fill(r.ok?await r.json():defaults);$('status').textContent=r.ok?'저장된 설정을 불러왔습니다.':'아직 게시된 설정이 없습니다. 기존 기본값을 표시합니다.'}catch(e){fill(defaults);$('status').textContent='기본값 표시 중: '+e.message}}
function show(user){$('login').hidden=!!user;$('editor').hidden=!user;if(user)load()}
const {data:{session}}=await client.auth.getSession();show(session?.user);
$('signIn').onclick=async()=>{const b=$('signIn');b.disabled=true;try{const{data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;show(data.user)}catch(e){$('loginStatus').textContent='로그인 실패: '+e.message}finally{b.disabled=false}};
$('save').onclick=async()=>{const b=$('save');b.disabled=true;$('status').textContent='저장 중...';try{const {data:{user}}=await client.auth.getUser();if(!user)throw Error('로그인이 필요합니다.');const content=JSON.stringify({...readForm(),updatedAt:new Date().toISOString()},null,2);const{error}=await client.storage.from(bucket).upload(path,new Blob([content],{type:'application/json'}),{upsert:true,contentType:'application/json',cacheControl:'0'});if(error)throw error;const{data,error:check}=await client.storage.from(bucket).download(path);if(check)throw check;const saved=JSON.parse(await data.text());if(saved.updatedAt!==JSON.parse(content).updatedAt)throw Error('저장 후 검증 불일치');$('status').textContent='게시 저장 및 재확인 완료. 고객 페이지를 새로고침하세요.'}catch(e){$('status').textContent='저장 실패: '+e.message}finally{b.disabled=false}};
$('reload').onclick=load;$('signOut').onclick=async()=>{await client.auth.signOut();show(null)};
</script></body></html>
